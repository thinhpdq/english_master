body {

header {

.stat-item {

.mode-btn {
background: #ffffff;

}

.mode-btn.active {
background: #15803d;

flex-direction: column;
align-items: center;

.flashcard-wrapper {

height: 410px;

cursor: pointer;
margin-bottom: 10px;
}

.flashcard {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
transition: transform 0.4s ease-out;
border-radius: 20px;
box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
}

.flashcard.flipped {
transform: rotateY(180deg);
}

.card-front, .card-back {
position: absolute;
width: 100%;
height: 100%;
backface-visibility: hidden;
border-radius: 20px;

flex-direction: column;
justify-content: space-between;
align-items: center;
padding: 14px;
text-align: center;
border: 3px solid #ffffff;
overflow-y: auto;
}

.card-front {
background: #ffffff;
}

.card-back {
background: #fef9c3;
color: #713f12;
transform: rotateY(180deg);
}

.card-image {
font-size: 3.2rem;
line-height: 1;
margin-bottom: 2px;
}

.word-en {
font-size: 1.35rem;
font-weight: 800;
color: #15803d;

}

.phonetic {
font-size: 0.8rem;
color: #475569;
font-weight: 600;
}

.word-vi {
font-size: 1.25rem;
font-weight: 800;
word-break: break-word;
}

.example-box {
background: rgba(255, 255, 255, 0.95);
padding: 8px 10px;
border-radius: 12px;
width: 100%;
border-left: 4px solid #15803d;
text-align: left;
box-shadow: 0 2px 6px rgba(0,0,0,0.03);

overflow-y: auto;
}

.example-grammar {
font-size: 0.65rem;

font-weight: 800;

margin-bottom: 2px;
}

.example-en {
font-size: 0.8rem;

color: #166534;
line-height: 1.25;
margin-bottom: 2px;
word-break: break-word;
}

.example-vi {
font-size: 0.75rem;
font-weight: 600;
color: #475569;
font-style: italic;
line-height: 1.2;
word-break: break-word;
}

.hint {
font-size: 0.62rem;
font-weight: 800;
opacity: 0.6;
text-transform: uppercase;
letter-spacing: 0.5px;
margin-top: 4px;
}

.audio-btn {
background-color: #15803d;
color: white;
border: none;
width: 40px;
height: 40px;
border-radius: 50%;
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;

box-shadow: 0 4px 12px rgba(21, 128, 61, 0.3);
transition: transform 0.1s;
flex-shrink: 0;
}

.audio-btn:active {
transform: scale(0.92);
}

.controls {
display: flex;
justify-content: space-between;
width: 100%;
gap: 8px;
margin-bottom: 10px;
}

.ctrl-btn {
flex: 1;
padding: 10px;
border: none;
border-radius: 12px;
background-color: #15803d;
color: white;
font-size: 0.9rem;
font-weight: 800;
cursor: pointer;
box-shadow: 0 4px 10px rgba(21, 128, 61, 0.2);
}

.tool-btn {
background-color: #ffffff;
border: 2px solid #15803d;
color: #15803d;
padding: 6px 12px;
border-radius: 12px;
font-size: 0.8rem;
font-weight: bold;
cursor: pointer;
}

.quiz-box {

width: 100%;
background: #ffffff;
padding: 18px;
border-radius: 20px;
box-shadow: 0 8px 24px rgba(0,0,0,0.08);
text-align: center;
border: 3px solid #86efac;
margin-bottom: 10px;
position: relative;
}

.timer-container {
position: absolute;
top: 12px;
right: 12px;
display: flex;
align-items: center;
justify-content: center;
width: 40px;
height: 40px;
}

.timer-svg {
transform: rotate(-90deg);
width: 40px;
height: 40px;
}

.timer-circle-bg {
fill: none;
stroke: #e2e8f0;
stroke-width: 4;
}

.timer-circle-progress {
fill: none;
stroke: #15803d;
stroke-width: 4;
stroke-dasharray: 100;
stroke-dashoffset: 0;
transition: stroke-dashoffset 0.1s linear, stroke 0.3s;
}

.timer-text {
position: absolute;
font-size: 0.85rem;
font-weight: 800;
color: #15803d;
}

.quiz-img {
font-size: 3.5rem;
margin-bottom: 4px;
}

.quiz-question {
font-size: 1.15rem;
font-weight: 800;
color: #15803d;
margin-bottom: 12px;
line-height: 1.35;
word-break: break-word;
}

.sentence-hint {
font-size: 0.72rem;
color: #dc2626;
font-weight: 800;
margin-bottom: 8px;
text-transform: uppercase;
}

.sentence-translation {

font-weight: 700;
margin-top: 8px;
padding: 8px 12px;
background: #f0fdf4;
border-radius: 10px;
border-left: 3px solid #15803d;

text-align: left;
word-break: break-word;
}

.quiz-options {

background: #f0fdf4;
color: #166534;

font-weight: 700;

.option-btn.wrong {

.progress-text {

let streak = 0;
let totalAnswered = 0;
let totalCorrect = 0;

let isAnswered = false;

// BIẾN QUẢN LÝ ĐỒNG HỒ ĐẾM NGƯỢC
let quizTimer = null;
const TOTAL_QUIZ_TIME = 10; // 10 giây
let timeLeft = TOTAL_QUIZ_TIME;

// WEB AUDIO SYNTHESIZER (Âm thanh Đúng/Sai)
function playSound(type) {
try {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.connect(gain);
gain.connect(ctx.destination);

if (type === 'correct') {
osc.type = 'sine';
osc.frequency.setValueAtTime(523.25, ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
gain.gain.setValueAtTime(0.3, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
osc.start();
osc.stop(ctx.currentTime + 0.25);
} else {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(220, ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(130.81, ctx.currentTime + 0.25);
gain.gain.setValueAtTime(0.3, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
osc.start();
osc.stop(ctx.currentTime + 0.25);
}
} catch (e) {}
}

function loadVoices() {
if ('speechSynthesis' in window) {
availableVoices = window.speechSynthesis.getVoices();
}
}

if ('speechSynthesis' in window) {
loadVoices();
window.speechSynthesis.onvoiceschanged = loadVoices;
}

function stopTimer() {
if (quizTimer) {
clearInterval(quizTimer);
quizTimer = null;
}
}

function startTimer(type, onTimeoutCallback) {
stopTimer();
timeLeft = TOTAL_QUIZ_TIME;

const textElem = document.getElementById(type === 'wordQuiz' ? 'wordTimerText' : 'sentenceTimerText');
const progressElem = document.getElementById(type === 'wordQuiz' ? 'wordTimerProgress' : 'sentenceTimerProgress');

if (!textElem || !progressElem) return;

textElem.innerText = timeLeft;
textElem.style.color = '#15803d';
progressElem.style.strokeDashoffset = '0';
progressElem.style.stroke = '#15803d';

quizTimer = setInterval(() => {
timeLeft--;
textElem.innerText = timeLeft;

const progressOffset = ((TOTAL_QUIZ_TIME - timeLeft) / TOTAL_QUIZ_TIME) * 100;
progressElem.style.strokeDashoffset = progressOffset;

if (timeLeft <= 3) {
textElem.style.color = '#dc2626';
progressElem.style.stroke = '#dc2626';
}

if (timeLeft <= 0) {
stopTimer();
onTimeoutCallback();
}
}, 1000);
}

function switchMode(mode) {
stopTimer();
currentMode = mode;
document.getElementById('btnModeCard').className = 'mode-btn' + (mode === 'card' ? ' active' : '');
document.getElementById('btnModeWordQuiz').className = 'mode-btn' + (mode === 'wordQuiz' ? ' active' : '');
document.getElementById('btnModeSentenceQuiz').className = 'mode-btn' + (mode === 'sentenceQuiz' ? ' active' : '');

document.getElementById('cardArea').style.display = 'none';
document.getElementById('wordQuizArea').style.display = 'none';
document.getElementById('sentenceQuizArea').style.display = 'none';

if (mode === 'card') {
document.getElementById('cardArea').style.display = 'block';
updateCard();
} else if (mode === 'wordQuiz') {
document.getElementById('wordQuizArea').style.display = 'block';
loadWordQuizQuestion();
} else if (mode === 'sentenceQuiz') {
document.getElementById('sentenceQuizArea').style.display = 'block';
loadSentenceQuizQuestion();
}
}

function renderCategoryButtons() {
const container = document.getElementById('categoryContainer');
container.innerHTML = '';
for (let cat in vocabularyData) {
const btn = document.createElement('button');
btn.className = 'cat-btn' + (cat === currentCategory ? ' active' : '');
btn.innerText = cat + " (" + vocabularyData[cat].length + ")";
btn.onclick = function() { selectCategory(cat); };
container.appendChild(btn);
}
}

function selectCategory(cat) {
stopTimer();
currentCategory = cat;
currentIndex = 0;
activeList = [...vocabularyData[currentCategory]];
renderCategoryButtons();

if (currentMode === 'card') updateCard();
else if (currentMode === 'wordQuiz') loadWordQuizQuestion();
else if (currentMode === 'sentenceQuiz') loadSentenceQuizQuestion();
}

function updateProgressBar() {
const pct = ((currentIndex + 1) / activeList.length) * 100;
document.getElementById('progressFill').style.width = pct + '%';
document.getElementById('progressText').innerText = (currentIndex + 1) + ' / ' + activeList.length;
}

function updateCard() {
document.getElementById('card').classList.remove('flipped');
const item = activeList[currentIndex];

document.getElementById('imgFront').innerText = item.img;
document.getElementById('imgBack').innerText = item.img;
document.getElementById('textEn').innerText = item.en;
document.getElementById('textPhonetic').innerText = item.phonetic;
document.getElementById('textVi').innerText = item.vi;
document.getElementById('textGrammar').innerText = '[' + item.grammar + ']';
document.getElementById('textExample').innerText = '"' + item.example + '"';
document.getElementById('textExampleVi').innerText = '👉 ' + item.exampleVi;

updateProgressBar();
}

function flipCard() {
document.getElementById('card').classList.toggle('flipped');
}

function prevCard() {
currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
updateCard();
}

function nextCard() {
currentIndex = (currentIndex + 1) % activeList.length;
updateCard();
}

function shuffleCards() {
stopTimer();
for (let i = activeList.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[activeList[i], activeList[j]] = [activeList[j], activeList[i]];
}
currentIndex = 0;
if (currentMode === 'card') updateCard();
else if (currentMode === 'wordQuiz') loadWordQuizQuestion();
else if (currentMode === 'sentenceQuiz') loadSentenceQuizQuestion();
}

function speakCurrentWord(event) {
if (event) event.stopPropagation();
speakText(activeList[currentIndex].en);
}

function speakText(text) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(text);
utterance.rate = 0.8;

if (availableVoices.length === 0) {
availableVoices = window.speechSynthesis.getVoices();
}

const preferredVoice = availableVoices.find(v =>
v.lang === 'en-GB' && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Oliver') || v.name.includes('Kate') || v.name.includes('Daniel'))
) || availableVoices.find(v => v.lang.startsWith('en'));

if (preferredVoice) utterance.voice = preferredVoice;
else utterance.lang = 'en-GB';

window.speechSynthesis.speak(utterance);
}
}

/* 1. QUIZ NGHĨA TỪ ĐƠN */
function loadWordQuizQuestion() {
isAnswered = false;
const currentItem = activeList[currentIndex];
document.getElementById('wordQuizImg').innerText = currentItem.img;
document.getElementById('wordQuizQuestion').innerText = currentItem.en;
updateProgressBar();

let correctAns = currentItem.vi;
let options = [correctAns];

let allViList = [];
for (let cat in vocabularyData) {
vocabularyData[cat].forEach(item => {
if (item.vi !== correctAns) allViList.push(item.vi);
});
}

allViList.sort(() => 0.5 - Math.random());
options.push(allViList[0], allViList[1]);
options.sort(() => 0.5 - Math.random());

const container = document.getElementById('wordQuizOptions');
container.innerHTML = '';
options.forEach(opt => {
const btn = document.createElement('button');
btn.className = 'option-btn';
btn.innerText = opt;
btn.onclick = function() { checkAnswer(btn, opt === correctAns, correctAns, 'wordQuiz'); };
container.appendChild(btn);
});

speakText(currentItem.en);

startTimer('wordQuiz', () => {
checkAnswer(null, false, correctAns, 'wordQuiz');
});
}

/* 2. QUIZ CẤU TRÚC CÂU MOVERS */
function loadSentenceQuizQuestion() {
isAnswered = false;
const currentItem = activeList[currentIndex];
document.getElementById('sentenceQuizImg').innerText = currentItem.img;
document.getElementById('sentenceGrammarHint').innerText = '[' + currentItem.grammar + ']';
document.getElementById('sentenceQuizQuestion').innerText = currentItem.sq;

const translationBox = document.getElementById('sentenceTranslation');
translationBox.style.display = 'none';

updateProgressBar();

let correctAns = currentItem.sqAns;
let options = [...currentItem.sqOptions];
options.sort(() => 0.5 - Math.random());

const container = document.getElementById('sentenceQuizOptions');
container.innerHTML = '';
options.forEach(opt => {
const btn = document.createElement('button');
btn.className = 'option-btn';
btn.innerText = opt;
btn.onclick = function() { checkAnswer(btn, opt === correctAns, correctAns, 'sentenceQuiz'); };
container.appendChild(btn);
});

startTimer('sentenceQuiz', () => {
checkAnswer(null, false, correctAns, 'sentenceQuiz');
});
}

function checkAnswer(btn, isCorrect, correctAnsText, quizType) {
if (isAnswered) return;
isAnswered = true;
stopTimer();

// Thống kê tỉ lệ đúng gộp
totalAnswered++;
if (isCorrect) totalCorrect++;

const containerId = quizType === 'wordQuiz' ? 'wordQuizOptions' : 'sentenceQuizOptions';
const buttons = document.querySelectorAll('#' + containerId + ' .option-btn');

buttons.forEach(b => {
b.disabled = true;
if (b.innerText === correctAnsText) {
b.classList.add('correct');
}
});

if (isCorrect) {
if (btn) btn.classList.add('correct');
playSound('correct');
score += 10;
streak += 1;
} else {
if (btn) btn.classList.add('wrong');
playSound('wrong');
streak = 0;
}

if (quizType === 'sentenceQuiz') {
const currentItem = activeList[currentIndex];
const fullSentenceText = currentItem.sq.replace('_____', currentItem.sqAns);
document.getElementById('sentenceQuizQuestion').innerText = fullSentenceText;

const translationBox = document.getElementById('sentenceTranslation');
translationBox.querySelector('span').innerText = currentItem.exampleVi;
translationBox.style.display = 'block';

setTimeout(() => {
speakText(fullSentenceText);
}, 300);
}

document.getElementById('scoreVal').innerText = score;
document.getElementById('streakVal').innerText = streak;

// Cập nhật Tỉ lệ đúng gộp (%)
const accuracyPct = Math.round((totalCorrect / totalAnswered) * 100);
document.getElementById('accuracyVal').innerText = accuracyPct + '%';

const delay = quizType === 'sentenceQuiz' ? 4500 : 1500;
setTimeout(() => {
currentIndex = (currentIndex + 1) % activeList.length;
if (quizType === 'wordQuiz') loadWordQuizQuestion();
else loadSentenceQuizQuestion();
}, delay);
}

window.onload = function() {
activeList = [...vocabularyData[currentCategory]];
renderCategoryButtons();
updateCard();
};
</script>
